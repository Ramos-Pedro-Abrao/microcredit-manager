services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-microcredit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-microcredit_local}
      POSTGRES_DB: ${POSTGRES_DB:-microcredit}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-microcredit} -d ${POSTGRES_DB:-microcredit}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
